name: Android Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      include_x86:
        description: "Добавить x86_64 (для эмулятора; в релиз не нужен)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      # Конвертер подписок (Xray JSON / список ссылок → YAML mihomo) проверяется
      # тем же парсером, которым ядро читает конфиг: переименованное в mihomo поле
      # иначе всплывёт уже на телефоне — туннель поднят, трафика нет.
      # Теги те же, что у сборки: без with_gvisor mihomo не соберёт узел WireGuard.
      - name: Test mihomo core
        working-directory: core
        run: go test -tags with_gvisor,cmfa ./...

      - name: Build mihomo core .aar
        working-directory: core
        run: |
          go mod download
          # target включает amd64 (x86_64-эмуляторы), ldflags выравнивает .so под 16 КБ
          # страницы (Android 15 / 16 KB page size), иначе либа не грузится на новых образах.
          # -tags with_gvisor ОБЯЗАТЕЛЕН: без него sing-tun подставляет заглушку,
          # TUN не поднимается и трафик молча уходит в никуда.
          # -tags cmfa ОБЯЗАТЕЛЕН (режим встраивания, ClashMetaForAndroid): без него
          # sing_tun при старте TUN лезет читать /data/system/packages.xml (маппинг
          # пакет→UID для android-rules) → на неroot Android permission denied →
          # "Start TUN listening error" → TUN не поднимается (подключено, но трафика нет).
          # С cmfa buildAndroidRules = no-op, пакетную фильтрацию делает VpnService.
          # -s -w выкидывают таблицу символов и отладочную информацию: это ~14 МБ
          # на каждую архитектуру, в релизе они не нужны.
          # x86_64 нужен только для эмулятора, в обычный релиз не кладём — иначе
          # пользователи качают лишние ~25 МБ.
          TARGETS="android/arm64,android/arm"
          if [ "${{ github.event.inputs.include_x86 }}" = "true" ]; then
            TARGETS="$TARGETS,android/amd64"
          fi
          echo "targets: $TARGETS"
          gomobile bind -v \
            -target="$TARGETS" \
            -androidapi 21 \
            -tags with_gvisor,cmfa \
            -ldflags="-s -w -extldflags=-Wl,-z,max-page-size=16384" \
            -o mihomo.aar .
          mkdir -p ../android/app/libs
          cp mihomo.aar ../android/app/libs/mihomo.aar

      - name: Sync web assets + native plugin config into android project
        working-directory: .
        run: |
          npm install
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap sync android

      # Ключ проверяется сразу после декодирования. Без проверки битый keystore
      # всплывает только на packageRelease — через две минуты сборки и в виде
      # ASN.1-исключения ("Tag number over 30 is not supported"), по которому
      # не понять, что именно сломалось: файл, пароль или алиас.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/misetanibox-release.p12"
          # tr выкидывает переносы и пробелы: секрет мог быть сохранён обёрнутым
          # по 76 колонок (обычный base64 без -w 0) или с хвостовым переводом строки
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$ks"

          # PKCS12 — это DER SEQUENCE, он ВСЕГДА начинается с 0x30 (обычно 3082).
          # Другое начало значит, что в секрете лежит не то: 1f8b — gzip,
          # fffe — текст в UTF-16 с BOM, efbb — UTF-8 с BOM, 4d00 — вывод
          # PowerShell, попавший в секрет вместе с кодировкой.
          head=$(head -c 2 "$ks" | od -An -tx1 | tr -d ' \n')
          if [ "${head:0:2}" != "30" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 не содержит base64 от PKCS12-хранилища"
            echo "первые байты: ${head:-пусто} (у валидного p12 — 3082), размер: $(stat -c%s "$ks") Б"
            echo "пересоздайте секрет одной строкой: base64 -w 0 misetanibox-release.p12"
            exit 1
          fi

          # Хранилище открывается своим паролем, и в нём есть нужный алиас.
          # -alias ловит пустой или переименованный ANDROID_KEY_ALIAS: без него
          # ключ не найдётся уже на этапе подписи.
          # Вывод собирается целиком: keytool пишет свои ошибки в stdout, и
          # редирект только stderr их бы потерял.
          if ! keytool -list -keystore "$ks" -storetype PKCS12 \
                 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
                 > "$RUNNER_TEMP/keytool.log" 2>&1; then
            echo "::error::keystore не открылся — проверьте ANDROID_KEYSTORE_PASSWORD и ANDROID_KEY_ALIAS"
            cat "$RUNNER_TEMP/keytool.log"
            exit 1
          fi
          echo "keystore в порядке"

      - name: Build release APK (signed)
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/misetanibox-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Misetanibox_android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Misetanibox_android
          path: Misetanibox_android.apk
          retention-days: 14
